<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>slider</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="Swiper/swiper-bundle.min.css">
</head>
<body>
	<div class="container">
		<div class="detail-banner">
			<div class="detail-banner__bg">
				<img src="img/back.jpg" alt="">
			</div>

			<div class="detail-banner__title">Слайдер</div>

			<div class="detail-banner__images">
				<div class="detail-banner__slider swiper js-swiper-slider">
					<div class="detail-banner__slider-nav">
						<button type="button" class="detail-banner__slider-arrow detail-banner__slider-arrow--prev" aria-label="Предыдущий слайд">
							<svg class="svg-icon" width="13" height="22" viewBox="0 0 13 22" fill="none"
								xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M11 1L1 11L11 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"
									stroke-linejoin="round" />
							</svg>
						</button>
						<button type="button" class="detail-banner__slider-arrow detail-banner__slider-arrow--next" aria-label="Следующий слайд">
							<svg class="svg-icon" width="13" height="22" viewBox="0 0 13 22" fill="none"
								xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
								<path d="M11 1L1 11L11 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"
									stroke-linejoin="round" />
							</svg>
						</button>
					</div>

					<div class="detail-banner__list swiper-wrapper">
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img1.jpg" alt="Слайд 1" width="800" height="600" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img2.jpeg" alt="Слайд 2" width="800" height="600" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img3.jpeg" alt="Слайд 3" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img4.jpeg" alt="Слайд 4" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img5.jpg" alt="Слайд 5" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img6.jpg" alt="Слайд 6" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img4.jpeg" alt="Слайд 7" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img2.jpeg" alt="Слайд 8" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img4.jpeg" alt="Слайд 9" width="800" height="600" loading="lazy" />
							</div>
						</div>
						<div class="detail-banner__item swiper-slide">
							<div class="detail-banner-item">
								<img src="img/img3.jpeg" alt="Слайд 10" width="800" height="600" loading="lazy" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="Swiper/swiper-bundle.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
